name: Browser tests
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true
env:
  MOTION_ONLY: >-
    ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci: motion only') }}
jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, ipad-touch, ipad-portrait]
        shard: >-
          ${{ fromJSON((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci: motion only')) && '[1]' || '[1,2,3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match @playwright/test in package-lock.json. Browsers and OS dependencies are included.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Check pure depth projection
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: node --test tests/*.unit.mjs
      - name: Install export validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 python3-venv
          python3 -m venv /tmp/petscii-test-venv
          /tmp/petscii-test-venv/bin/python -m pip install py65==1.2.0
          echo "/tmp/petscii-test-venv/bin" >> "$GITHUB_PATH"
      - name: Check portrait rendering and navigation regressions
        if: env.MOTION_ONLY != 'true' && matrix.project == 'ipad-portrait' && matrix.shard == 1
        run: npx playwright test tests/colors.spec.cjs tests/layout.spec.cjs --project=ipad-portrait --workers=1 --grep 'authentic bitmap geometry|glyph picker is independent'
      # Run each browser in three independent shards; retain every test in every browser.
      # Per-test timeouts and retries remain defined in playwright.config.cjs.
      - name: Run focused motion and export checks
        if: env.MOTION_ONLY == 'true'
        run: >-
          npm test -- 'tests/(sine-scroll|diagonal-scroll|demoscene|wavelength|solid-motion|depth-exports|depth-surfaces|depth-waveform|space-warp|composite|cycles|independent-rates)\.spec\.cjs$'
          --project=${{ matrix.project }} --workers=1 --global-timeout=900000
      - name: Run browser and export checks
        if: env.MOTION_ONLY != 'true'
        run: npm test -- --project=${{ matrix.project }} --workers=1 --shard=${{ matrix.shard }}/3 --global-timeout=900000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

name: Browser tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, ipad-touch, ipad-portrait]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match @playwright/test in package-lock.json. Browsers and OS dependencies are included.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install export validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 python3-venv
          python3 -m venv /tmp/petscii-test-venv
          /tmp/petscii-test-venv/bin/python -m pip install py65==1.2.0
          echo "/tmp/petscii-test-venv/bin" >> "$GITHUB_PATH"
      - name: Run browser and export checks
        run: npm test -- --project=${{ matrix.project }} --workers=1 --global-timeout=1200000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

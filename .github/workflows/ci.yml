name: Browser tests
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Validation level
        type: choice
        options: [focused, full]
        default: focused
permissions:
  contents: read
concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.choose.outputs.mode }}
      specs: ${{ steps.choose.outputs.specs }}
      full: ${{ steps.choose.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: choose
        env:
          EVENT: ${{ github.event_name }}
          FULL_REQUEST: "${{ inputs.suite == 'full' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci: full')) }}"
          MOTION_ONLY: "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci: motion only') }}"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL_REQUEST" == true ]]; then
            node scripts/ci-select-tests.cjs </dev/null
            exit 0
          fi
          if [[ "$EVENT" == workflow_dispatch ]]; then
            # Manual focused runs use a representative smoke test.
            printf 'tests/layout.spec.cjs\n' | node scripts/ci-select-tests.cjs
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # A missing base must not silently bypass validation.
            FULL_REQUEST=true node scripts/ci-select-tests.cjs </dev/null
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-select-tests.cjs
  unit:
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.unit.mjs
  playwright:
    needs: select
    if: needs.select.outputs.mode != 'none'
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, ipad-touch, ipad-portrait]
        shard: ${{ fromJSON(needs.select.outputs.mode == 'full' && '[1,2,3]' || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --shm-size=1gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install export validation tools for full or export-focused checks
        if: needs.select.outputs.mode == 'full' || contains(needs.select.outputs.specs, 'exports.spec.cjs') || contains(needs.select.outputs.specs, 'c64')
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 python3-venv
          python3 -m venv /tmp/petscii-test-venv
          /tmp/petscii-test-venv/bin/python -m pip install py65==1.2.0
          echo "/tmp/petscii-test-venv/bin" >> "$GITHUB_PATH"
      - name: Focused browser checks
        if: needs.select.outputs.mode == 'focused'
        shell: bash
        env:
          SPECS: ${{ needs.select.outputs.specs }}
        run: |
          read -r -a files <<< "$SPECS"
          npm test -- "${files[@]}" --project=${{ matrix.project }} --workers=1 --global-timeout=600000
      - name: Full browser and export suite
        if: needs.select.outputs.mode == 'full'
        run: npm test -- --project=${{ matrix.project }} --workers=1 --shard=${{ matrix.shard }}/3 --global-timeout=1200000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  validation:
    name: Validation gate
    if: always()
    needs: [select, unit, playwright]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks to pass
        env:
          SELECTION: ${{ needs.select.result }}
          MODE: ${{ needs.select.outputs.mode }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.playwright.result }}
        run: |
          [[ "$SELECTION" == success ]] || exit 1
          if [[ "$MODE" == none ]]; then exit 0; fi
          [[ "$UNIT" == success && "$BROWSER" == success ]]
